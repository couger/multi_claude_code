name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # 代码检查
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript type check (renderer)
        run: npx tsc --noEmit

      - name: TypeScript type check (main process)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: ESLint check
        run: npx eslint src --ext .ts,.tsx --report-unused-disable-directives

      - name: Check for issues
        run: |
          echo "✅ Type check and lint passed"

  # 构建测试
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ] || [ ! -d "dist-electron" ]; then
            echo "❌ Build output directories missing"
            exit 1
          fi
          echo "✅ Build completed successfully"
        shell: bash

  # 安全检查
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        run: |
          # 检查是否有 API keys 等敏感信息
          if grep -rE "(api[_-]?key|apikey|secret[_-]?key|secretkey|anthropic[_-]?key|claude[_-]?api)" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/ 2>/dev/null; then
            echo "⚠️ Warning: Potential API key patterns found in source files"
            echo "Please ensure no secrets are committed"
          fi
          echo "✅ Secret check completed"

  # 打包发布（仅 release）
  release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/**/*
          retention-days: 30